name: Reversible preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests, lint and APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package preview APK
        run: |
          python3 -c 'import json; p=json.load(open("app/build/outputs/apk/debug/output-metadata.json")); assert p["applicationId"] == "com.example.mangaromaji.preview", "Refusing to publish an APK that could replace the original"'
          mkdir -p dist
          NAME="MangaRomaji-1.1.0-preview-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$NAME"
          cd dist
          sha256sum "$NAME" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MangaRomaji-preview-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-test-lint-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/reports/
      - name: Publish reversible prerelease
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh release create "preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" dist/*.apk dist/SHA256SUMS.txt --target "$RELEASE_SHA" --title "Manga Romaji Preview ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --notes-file PREVIEW.md --prerelease
